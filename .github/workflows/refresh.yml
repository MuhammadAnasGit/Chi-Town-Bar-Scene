name: Daily refresh

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests duckdb pandas
      - run: python ingestion/download_licenses.py
      - run: python transform/build_bars.py
      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/silver/bars.parquet
          git diff --staged --quiet || git commit -m "Daily data refresh"
          git push